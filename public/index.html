<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 转网页工具</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    padding: 32px 20px;
    text-align: center;
  }
  header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  header p { font-size: 15px; opacity: 0.8; }
  .container { max-width: 720px; width: 100%; padding: 32px 20px; }

  /* 拖拽区 */
  .drop-zone {
    border: 3px dashed #c0c4d0;
    border-radius: 16px;
    padding: 60px 20px;
    text-align: center;
    background: #fff;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .drop-zone:hover { border-color: #4a6cf7; background: #f8f9ff; }
  .drop-zone.dragover {
    border-color: #4a6cf7;
    background: #eef1ff;
    transform: scale(1.02);
  }
  .drop-zone.has-file {
    border-style: solid;
    border-color: #4a6cf7;
    background: #f8f9ff;
    padding: 30px 20px;
  }
  .drop-zone .icon { font-size: 56px; margin-bottom: 16px; display: block; }
  .drop-zone .text { font-size: 18px; color: #444; margin-bottom: 8px; }
  .drop-zone .sub { font-size: 14px; color: #888; }
  .drop-zone input[type="file"] { display: none; }
  .drop-zone .file-info { display: none; margin-top: 12px; }
  .drop-zone.has-file .file-info { display: block; }
  .drop-zone.has-file .icon { font-size: 36px; }
  .drop-zone.has-file .preview-text { font-size: 15px; color: #4a6cf7; font-weight: 600; }

  /* 控制区 */
  .controls { display: none; margin-top: 24px; }
  .controls.active { display: block; }
  .controls .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 14px; color: #555; font-weight: 500; }
  .controls input[type="text"] {
    flex: 1; min-width: 180px; padding: 10px 14px; border: 2px solid #ddd;
    border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s;
  }
  .controls input[type="text"]:focus { border-color: #4a6cf7; }
  .controls input[type="range"] { width: 140px; }
  .controls .quality-label { font-size: 13px; color: #888; min-width: 40px; }

  /* 按钮 */
  .btn {
    padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px;
    font-weight: 600; cursor: pointer; transition: all 0.2s ease;
  }
  .btn-primary { background: #4a6cf7; color: #fff; }
  .btn-primary:hover { background: #3b5de7; transform: translateY(-1px); }
  .btn-primary:disabled { background: #a0b0e0; cursor: not-allowed; transform: none; }
  .btn-success { background: #10b981; color: #fff; }
  .btn-success:hover { background: #059669; }
  .btn-outline { background: transparent; border: 2px solid #ddd; color: #555; }
  .btn-outline:hover { border-color: #4a6cf7; color: #4a6cf7; }

  /* 进度 */
  .progress-wrap { display: none; margin-top: 20px; }
  .progress-wrap.active { display: block; }
  .progress-bar {
    width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #4a6cf7, #10b981);
    border-radius: 4px; transition: width 0.3s ease;
  }
  .progress-text { font-size: 14px; color: #666; margin-top: 8px; text-align: center; }

  /* 结果区 */
  .result { display: none; margin-top: 24px; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .result.active { display: block; }
  .result .label { font-size: 14px; color: #888; margin-bottom: 8px; }
  .result .link-box {
    display: flex; gap: 8px; align-items: center;
    background: #f8f9ff; border: 2px solid #e0e4f0; border-radius: 8px; padding: 4px;
  }
  .result .link-box input {
    flex: 1; border: none; background: transparent; padding: 10px 14px;
    font-size: 15px; color: #1a1a2e; outline: none;
  }
  .result .link-box .copy-btn {
    padding: 8px 16px; background: #4a6cf7; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap;
  }
  .result .link-box .copy-btn:hover { background: #3b5de7; }
  .result .link-box .copy-btn.copied { background: #10b981; }
  .result .preview-link {
    display: inline-block; margin-top: 12px; color: #4a6cf7;
    text-decoration: none; font-size: 14px;
  }
  .result .preview-link:hover { text-decoration: underline; }

  /* 提示 */
  .info-box {
    background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px;
    padding: 12px 16px; margin-top: 16px; font-size: 13px; color: #795548;
    line-height: 1.6;
  }

  footer {
    margin-top: 48px; padding: 20px; color: #999; font-size: 13px;
    text-align: center;
  }
  @media (max-width: 480px) {
    header h1 { font-size: 22px; }
    .drop-zone { padding: 40px 16px; }
    .drop-zone .icon { font-size: 40px; }
    .controls .row { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<header>
  <h1>📄 PDF → 网页</h1>
  <p>上传 PDF，自动生成可分享的翻页网页链接</p>
</header>

<div class="container">

  <!-- 拖拽区 -->
  <div class="drop-zone" id="dropZone">
    <span class="icon">📂</span>
    <div class="text">拖拽 PDF 到此处</div>
    <div class="sub">或点击选择文件</div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf">
    <div class="file-info">
      <div class="preview-text" id="fileName"></div>
    </div>
  </div>

  <!-- 控制区 -->
  <div class="controls" id="controls">
    <div class="row" style="margin-bottom:12px">
      <label>文档名称</label>
      <input type="text" id="docTitle" placeholder="输入文档名称（可选）">
    </div>
    <div class="row">
      <label>图片质量</label>
      <input type="range" id="quality" min="0.3" max="1.0" step="0.05" value="0.7">
      <span class="quality-label" id="qualityLabel">高</span>
      <button class="btn btn-primary" id="convertBtn" disabled>🚀 开始转换</button>
    </div>
  </div>

  <!-- 进度 -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar">
      <div class="fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <!-- 结果 -->
  <div class="result" id="result">
    <div class="label">✅ 转换完成！分享这个链接：</div>
    <div class="link-box">
      <input type="text" id="resultLink" readonly>
      <button class="copy-btn" id="copyBtn">复制链接</button>
    </div>
    <a class="preview-link" id="previewLink" target="_blank" rel="noopener">🔗 在新标签页中打开查看 →</a>
  </div>

  <div class="info-box">
    <strong>🔒 隐私说明：</strong>PDF 的每一页会先在你的浏览器中渲染成图片，
    然后上传到服务器存储。上传后你将获得一个可分享的链接，链接有效期为保存时间。
  </div>

</div>

<footer>
  PDF 转网页工具 &mdash; 纯前端渲染 + 云端存储
</footer>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

// DOM 引用
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const controls = document.getElementById('controls');
const docTitle = document.getElementById('docTitle');
const quality = document.getElementById('quality');
const qualityLabel = document.getElementById('qualityLabel');
const convertBtn = document.getElementById('convertBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const result = document.getElementById('result');
const resultLink = document.getElementById('resultLink');
const previewLink = document.getElementById('previewLink');
const copyBtn = document.getElementById('copyBtn');

let currentFile = null;

// ---------- 质量滑块 ----------
quality.addEventListener('input', () => {
  const v = parseFloat(quality.value);
  if (v >= 0.9) qualityLabel.textContent = '最高';
  else if (v >= 0.7) qualityLabel.textContent = '高';
  else if (v >= 0.5) qualityLabel.textContent = '中';
  else qualityLabel.textContent = '低';
});

// ---------- 拖拽事件 ----------
dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (files.length > 0) handleFile(files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    alert('请选择 PDF 文件');
    return;
  }
  currentFile = file;
  fileName.textContent = `📄 ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
  dropZone.classList.add('has-file');
  controls.classList.add('active');
  result.classList.remove('active');
  convertBtn.disabled = false;
  if (!docTitle.value) docTitle.value = file.name.replace(/\.pdf$/i, '');
}

// ---------- 转换 ----------
convertBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  convertBtn.disabled = true;
  convertBtn.textContent = '⏳ 转换中...';
  result.classList.remove('active');
  progressWrap.classList.add('active');

  try {
    const q = parseFloat(quality.value);
    const title = docTitle.value.trim() || currentFile.name.replace(/\.pdf$/i, '');

    // 读取 PDF
    const arrayBuffer = await currentFile.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const totalPages = pdf.numPages;

    progressText.textContent = `正在渲染第 1 / ${totalPages} 页...`;
    progressFill.style.width = '0%';

    const images = [];
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    for (let i = 1; i <= totalPages; i++) {
      progressText.textContent = `正在渲染第 ${i} / ${totalPages} 页...`;
      progressFill.style.width = `${(i / totalPages) * 50}%`;

      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.0 });
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport }).promise;

      // 转为 JPEG base64
      const dataUrl = canvas.toDataURL('image/jpeg', q);
      images.push(dataUrl);

      // 释放内存
      page.cleanup();
    }

    progressFill.style.width = '55%';
    progressText.textContent = `正在上传 ${images.length} 页图片...`;

    // 上传到服务器
    const resp = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images, title })
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error || '上传失败');
    }

    const data = await resp.json();

    progressFill.style.width = '100%';
    progressText.textContent = `✅ 完成！共 ${totalPages} 页`;

    // 显示结果
    const baseUrl = window.location.origin;
    const fullUrl = baseUrl + data.viewUrl;
    resultLink.value = fullUrl;
    previewLink.href = data.viewUrl;
    result.classList.add('active');

    // 滚动到结果
    result.scrollIntoView({ behavior: 'smooth', block: 'center' });

  } catch (err) {
    console.error(err);
    progressText.textContent = `❌ 出错: ${err.message}`;
    alert('转换失败: ' + err.message);
  } finally {
    convertBtn.disabled = false;
    convertBtn.textContent = '🚀 开始转换';
  }
});

// ---------- 复制链接 ----------
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(resultLink.value);
    copyBtn.textContent = '✅ 已复制';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = '复制链接';
      copyBtn.classList.remove('copied');
    }, 2000);
  } catch {
    // fallback
    resultLink.select();
    document.execCommand('copy');
    copyBtn.textContent = '✅ 已复制';
    setTimeout(() => { copyBtn.textContent = '复制链接'; }, 2000);
  }
});
</script>

</body>
</html>
