<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title id="pageTitle">加载中...</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1a;
    color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-touch-callout: none;
  }

  .viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #0f0f1a;
    overflow: hidden;
  }

  .book {
    perspective: 2500px;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .page-wrap {
    position: relative;
    max-width: 98vw;
    max-height: 98vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-under {
    display: block;
    max-width: 98vw;
    max-height: 98vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
    position: relative;
    z-index: 1;
  }

  .page-flip {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: left center;
    transform: rotateY(0deg);
    z-index: 10;
    pointer-events: none;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform;
    transition: none;
  }
  .page-flip img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }

  /* ===== 翻页按钮（重新加上） ===== */
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.3);
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .nav-btn:hover {
    background: rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.7);
  }
  .nav-btn:active {
    transform: translateY(-50%) scale(0.92);
  }
  .nav-btn.prev { left: 14px; }
  .nav-btn.next { right: 14px; }
  .nav-btn.hidden { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    .nav-btn { width: 40px; height: 40px; font-size: 20px; }
    .nav-btn.prev { left: 6px; }
    .nav-btn.next { right: 6px; }
  }

  /* ===== 页码 ===== */
  .page-info {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    z-index: 30;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .page-info.show { opacity: 1; }

  /* ===== 加载进度条（预加载用） ===== */
  .preload-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, #4a6cf7, #7c3aed);
    z-index: 100;
    width: 0%;
    transition: width 0.3s ease;
    opacity: 0;
  }
  .preload-bar.active { opacity: 1; }

  /* ===== 加载状态 ===== */
  .loading, .error {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: #0f0f1a;
    z-index: 50;
  }
  .loading .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top: 3px solid #4a6cf7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .text, .error .text { color: rgba(255,255,255,0.5); font-size: 15px; }
  .error .emoji { font-size: 48px; }
  .error .btn { margin-top: 8px; padding: 10px 28px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }
  .error .btn:hover { border-color: #4a6cf7; color: #4a6cf7; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="text" id="loadingText">正在加载文档...</div>
</div>

<div class="error" id="error" style="display:none">
  <div class="emoji">📄</div>
  <div class="text" id="errorText">无法加载文档</div>
  <button class="btn" onclick="location.reload()">重新加载</button>
</div>

<!-- 预加载进度 -->
<div class="preload-bar" id="preloadBar"></div>

<div class="viewer" id="viewer" style="display:none">
  <div class="book" id="book">
    <div class="page-wrap" id="pageWrap">
      <img class="page-under" id="pageUnder" src="" alt="">
      <div class="page-flip" id="pageFlip">
        <img id="flipImg" src="" alt="">
      </div>
    </div>
  </div>

  <!-- 翻页按钮 -->
  <button class="nav-btn prev" id="prevBtn">‹</button>
  <button class="nav-btn next" id="nextBtn">›</button>

  <div class="page-info" id="pageInfo">0 / 0</div>
</div>

<script>
const id = new URLSearchParams(window.location.search).get('id');
if (!id) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
  document.getElementById('errorText').textContent = '缺少文档 ID，请检查链接';
  throw new Error('no id');
}

// ===== 状态 =====
let images = [], totalPages = 0, currentPage = 0, docTitle = '';
let isFlipping = false;
let preloadedCount = 0;

// ===== DOM =====
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const error = document.getElementById('error');
const errorText = document.getElementById('errorText');
const viewer = document.getElementById('viewer');
const pageUnder = document.getElementById('pageUnder');
const pageFlip = document.getElementById('pageFlip');
const flipImg = document.getElementById('flipImg');
const pageWrap = document.getElementById('pageWrap');
const pageInfo = document.getElementById('pageInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const preloadBar = document.getElementById('preloadBar');

// ===== 预加载图片（全部后台加载） =====
function preloadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => reject(url);
    img.src = url;
  });
}

async function preloadAllImages(imageUrls) {
  preloadBar.classList.add('active');
  preloadBar.style.width = '0%';
  const total = imageUrls.length;

  // 逐个加载，更新进度
  for (let i = 0; i < total; i++) {
    try {
      await preloadImage(imageUrls[i]);
    } catch(e) {
      // 忽略加载失败
    }
    preloadedCount = i + 1;
    preloadBar.style.width = `${((i + 1) / total) * 100}%`;
  }

  // 加载完隐藏进度条
  setTimeout(() => {
    preloadBar.classList.remove('active');
  }, 500);
}

// ===== 页码显示 =====
let pageInfoTimer = null;
function showPageInfo() {
  pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
  pageInfo.classList.add('show');
  clearTimeout(pageInfoTimer);
  pageInfoTimer = setTimeout(() => pageInfo.classList.remove('show'), 2000);
}

// ===== 更新按钮状态 =====
function updateButtons() {
  prevBtn.classList.toggle('hidden', currentPage <= 0);
  nextBtn.classList.toggle('hidden', currentPage >= totalPages - 1);
}

// ===== 翻页动画 =====
function animateFlipTo(angle, dur) {
  return new Promise(resolve => {
    pageFlip.style.transition = `transform ${dur}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
    pageFlip.style.transform = `rotateY(${angle}deg)`;
    const onEnd = () => { pageFlip.ontransitionend = null; pageFlip.ontransitioncancel = null; resolve(); };
    pageFlip.ontransitionend = onEnd;
    pageFlip.ontransitioncancel = onEnd;
    setTimeout(onEnd, dur + 50);
  });
}

async function turnPage(direction) {
  const nextIdx = currentPage + direction;
  if (isFlipping || nextIdx < 0 || nextIdx >= totalPages) return;
  isFlipping = true;

  // 确保目标页已加载
  try { await preloadImage(images[nextIdx]); } catch(e) {}

  pageUnder.src = images[nextIdx];
  flipImg.src = images[currentPage];

  pageFlip.style.transition = 'none';
  pageFlip.style.transform = 'rotateY(0deg)';
  void pageWrap.offsetHeight;

  const targetAngle = direction === 1 ? -180 : 180;
  await animateFlipTo(targetAngle, 500);

  currentPage = nextIdx;
  pageFlip.style.transition = 'none';
  pageFlip.style.transform = 'rotateY(0deg)';
  pageUnder.src = images[currentPage];
  updateButtons();
  isFlipping = false;
  showPageInfo();
}

// ===== 按钮点击 =====
prevBtn.addEventListener('click', () => turnPage(-1));
nextBtn.addEventListener('click', () => turnPage(1));

// ===== 拖拽翻页（鼠标 + 触屏统一） =====
let dragState = null;
let rafId = null;

function onPointerDown(x) {
  if (isFlipping) return;
  const rect = viewer.getBoundingClientRect();
  dragState = {
    startX: x,
    currentX: x,
    moved: false,
    startFlip: false,
    targetIdx: -1,
    direction: 0
  };
}

function onPointerMove(x) {
  if (!dragState || isFlipping) return;

  const dx = x - dragState.startX;

  // 死区 10px
  if (!dragState.startFlip) {
    if (Math.abs(dx) < 10) return;
    const dir = dx < 0 ? 1 : -1;
    const targetIdx = currentPage + dir;
    if (targetIdx < 0 || targetIdx >= totalPages) {
      dragState = null;
      return;
    }
    dragState.startFlip = true;
    dragState.direction = dir;
    dragState.targetIdx = targetIdx;

    // 预加载目标页
    preloadImage(images[targetIdx]).catch(() => {});

    // 设置翻页层 = 当前页，底层 = 目标页
    pageUnder.src = images[targetIdx];
    flipImg.src = images[currentPage];
    pageFlip.style.transition = 'none';
    pageFlip.style.transform = 'rotateY(0deg)';
    void pageWrap.offsetHeight;
  }

  dragState.moved = true;
  dragState.currentX = x;

  // 使用 requestAnimationFrame 避免卡顿
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => {
    rafId = null;
    const wrapW = pageWrap.offsetWidth || window.innerWidth;
    let progress = dx / (wrapW * 0.55);
    progress = Math.max(-1, Math.min(1, progress));
    let angle = progress * -180;
    angle = Math.max(-180, Math.min(180, angle));
    pageFlip.style.transition = 'none';
    pageFlip.style.transform = `rotateY(${angle}deg)`;
  });
}

function onPointerUp() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (!dragState) return;

  if (dragState.startFlip && dragState.moved) {
    const dx = dragState.currentX - dragState.startX;
    if (Math.abs(dx) > 40) {
      const dir = dx < 0 ? 1 : -1;
      const targetIdx = currentPage + dir;
      if (targetIdx >= 0 && targetIdx < totalPages) {
        isFlipping = true;
        const finalAngle = dir === 1 ? -180 : 180;
        pageFlip.style.transition = 'transform 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        pageFlip.style.transform = `rotateY(${finalAngle}deg)`;

        setTimeout(() => {
          currentPage = targetIdx;
          pageFlip.style.transition = 'none';
          pageFlip.style.transform = 'rotateY(0deg)';
          pageUnder.src = images[currentPage];
          updateButtons();
          isFlipping = false;
          showPageInfo();
        }, 260);
        dragState = null;
        return;
      }
    }
    // 弹回
    pageFlip.style.transition = 'transform 200ms ease';
    pageFlip.style.transform = 'rotateY(0deg)';
  }
  dragState = null;
}

// ===== 事件绑定 =====
viewer.addEventListener('mousedown', (e) => onPointerDown(e.clientX));
window.addEventListener('mousemove', (e) => {
  if (dragState) onPointerMove(e.clientX);
});
window.addEventListener('mouseup', () => {
  if (dragState) onPointerUp();
});

viewer.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  onPointerDown(e.touches[0].clientX);
}, { passive: true });

viewer.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  onPointerMove(e.touches[0].clientX);
}, { passive: true });

viewer.addEventListener('touchend', (e) => {
  onPointerUp();
}, { passive: true });

// 键盘
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') turnPage(-1);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    turnPage(1);
  }
});

// ===== 加载文档 =====
async function loadDoc() {
  try {
    loadingText.textContent = '加载文档信息...';
    const resp = await fetch(`/api/view/${id}`);
    if (!resp.ok) throw new Error(resp.status === 404 ? '文档不存在或已过期' : '加载失败');
    const data = await resp.json();
    images = data.images;
    totalPages = data.totalPages;
    docTitle = data.title || '未命名文档';
    document.title = docTitle;

    const hash = window.location.hash.match(/page=(\d+)/);
    currentPage = hash ? Math.max(0, Math.min(parseInt(hash[1]) - 1, totalPages - 1)) : 0;

    loadingText.textContent = '加载页面...';
    // 先加载当前页才显示
    await preloadImage(images[currentPage]);

    loading.style.display = 'none';
    viewer.style.display = 'flex';
    pageUnder.src = images[currentPage];
    updateButtons();
    showPageInfo();

    // 后台预加载所有页面
    preloadAllImages(images);

  } catch (err) {
    loading.style.display = 'none';
    error.style.display = 'flex';
    errorText.textContent = err.message;
  }
}

loadDoc();
</script>
</body>
</html>
