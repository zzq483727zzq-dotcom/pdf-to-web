<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title id="pageTitle">加载中...</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1a;
    color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-touch-callout: none;
  }

  .viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #0f0f1a;
    overflow: hidden;
  }

  .page-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .page-wrap img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
    transition: opacity 0.15s ease;
  }

  /* 翻页按钮 */
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.3);
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .nav-btn:hover {
    background: rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.7);
  }
  .nav-btn:active { transform: translateY(-50%) scale(0.92); }
  .nav-btn.prev { left: 14px; }
  .nav-btn.next { right: 14px; }
  .nav-btn.hidden { opacity: 0; pointer-events: none; }

  /* 点击区域（左右半屏） */
  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40%;
    z-index: 20;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .click-zone.left  { left: 0; }
  .click-zone.right { right: 0; }

  /* 页码 */
  .page-info {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    z-index: 30;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .page-info.show { opacity: 1; }

  /* 预加载进度 */
  .preload-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, #4a6cf7, #7c3aed);
    z-index: 100;
    width: 0%;
    transition: width 0.3s ease;
    opacity: 0;
  }
  .preload-bar.active { opacity: 1; }

  /* 加载状态 */
  .loading, .error {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: #0f0f1a;
    z-index: 50;
  }
  .loading .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top: 3px solid #4a6cf7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .text, .error .text { color: rgba(255,255,255,0.5); font-size: 15px; }
  .error .emoji { font-size: 48px; }
  .error .btn { margin-top: 8px; padding: 10px 28px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }
  .error .btn:hover { border-color: #4a6cf7; color: #4a6cf7; }

  @media (max-width: 640px) {
    .nav-btn { width: 40px; height: 40px; font-size: 20px; }
    .nav-btn.prev { left: 6px; }
    .nav-btn.next { right: 6px; }
    .click-zone { width: 45%; }
    .page-info { font-size: 12px; padding: 6px 16px; bottom: 20px; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="text" id="loadingText">正在加载文档...</div>
</div>

<div class="error" id="error" style="display:none">
  <div class="emoji">📄</div>
  <div class="text" id="errorText">无法加载文档</div>
  <button class="btn" onclick="location.reload()">重新加载</button>
</div>

<div class="preload-bar" id="preloadBar"></div>

<div class="viewer" id="viewer" style="display:none">
  <div class="page-wrap">
    <img id="pageImage" src="" alt="">
  </div>

  <!-- 点击区域 -->
  <div class="click-zone left" id="zoneLeft"></div>
  <div class="click-zone right" id="zoneRight"></div>

  <!-- 翻页按钮 -->
  <button class="nav-btn prev" id="prevBtn">‹</button>
  <button class="nav-btn next" id="nextBtn">›</button>

  <div class="page-info" id="pageInfo">0 / 0</div>
</div>

<script>
const id = new URLSearchParams(window.location.search).get('id');
if (!id) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
  document.getElementById('errorText').textContent = '缺少文档 ID';
  throw new Error('no id');
}

let images = [], totalPages = 0, currentPage = 0, docTitle = '';
const preloadCache = new Map();

const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const error = document.getElementById('error');
const errorText = document.getElementById('errorText');
const viewer = document.getElementById('viewer');
const pageImage = document.getElementById('pageImage');
const pageInfo = document.getElementById('pageInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const zoneLeft = document.getElementById('zoneLeft');
const zoneRight = document.getElementById('zoneRight');
const preloadBar = document.getElementById('preloadBar');

// 预加载单张
function preloadOne(url) {
  if (preloadCache.has(url)) return preloadCache.get(url);
  const p = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(url);
    img.onerror = () => rej(url);
    img.src = url;
  });
  preloadCache.set(url, p);
  return p;
}

// 全部预加载
async function preloadAll(urls) {
  preloadBar.classList.add('active');
  preloadBar.style.width = '0%';
  for (let i = 0; i < urls.length; i++) {
    try { await preloadOne(urls[i]); } catch(e) {}
    preloadBar.style.width = `${((i + 1) / urls.length) * 100}%`;
  }
  setTimeout(() => preloadBar.classList.remove('active'), 500);
}

// 显示页码
let pageInfoTimer = null;
function showPageInfo() {
  pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
  pageInfo.classList.add('show');
  clearTimeout(pageInfoTimer);
  pageInfoTimer = setTimeout(() => pageInfo.classList.remove('show'), 2000);
}

// 更新按钮
function updateButtons() {
  prevBtn.classList.toggle('hidden', currentPage <= 0);
  nextBtn.classList.toggle('hidden', currentPage >= totalPages - 1);
}

// 翻页
function goToPage(idx) {
  if (idx < 0 || idx >= totalPages || idx === currentPage) return;
  currentPage = idx;
  pageImage.src = images[currentPage];
  updateButtons();
  showPageInfo();
}

function goPrev() { goToPage(currentPage - 1); }
function goNext() { goToPage(currentPage + 1); }

// 事件
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
zoneLeft.addEventListener('click', goPrev);
zoneRight.addEventListener('click', goNext);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goPrev();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    goNext();
  }
});

// 触摸滑动（简单翻页，不跟手）
let touchStartX = 0;
viewer.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
viewer.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) {
    if (diff > 0) goPrev();
    else goNext();
  }
}, { passive: true });

// 加载文档
async function loadDoc() {
  try {
    loadingText.textContent = '加载文档信息...';
    const resp = await fetch(`/api/view/${id}`);
    if (!resp.ok) throw new Error(resp.status === 404 ? '文档不存在或已过期' : '加载失败');
    const data = await resp.json();
    images = data.images;
    totalPages = data.totalPages;
    docTitle = data.title || '未命名文档';
    document.title = docTitle;

    const hash = window.location.hash.match(/page=(\d+)/);
    currentPage = hash ? Math.max(0, Math.min(parseInt(hash[1]) - 1, totalPages - 1)) : 0;

    loadingText.textContent = '加载页面...';
    await preloadOne(images[currentPage]);

    loading.style.display = 'none';
    viewer.style.display = 'flex';
    pageImage.src = images[currentPage];
    updateButtons();
    showPageInfo();

    // 后台预加载所有
    preloadAll(images);

  } catch (err) {
    loading.style.display = 'none';
    error.style.display = 'flex';
    errorText.textContent = err.message;
  }
}

loadDoc();
</script>
</body>
</html>
