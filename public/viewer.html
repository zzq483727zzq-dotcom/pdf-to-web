<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">加载中...</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f0f1a;
    color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ===== 全屏查看器 ===== */
  .viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #0f0f1a;
  }

  /* ===== 翻页容器 ===== */
  .book {
    perspective: 2500px;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .page-wrap {
    position: relative;
    max-width: 98vw;
    max-height: 98vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 底层页（新页面，被翻出来） */
  .page-under {
    display: block;
    max-width: 98vw;
    max-height: 98vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.3s ease;
    position: relative;
    z-index: 1;
  }
  .page-under.show {
    opacity: 1;
  }

  /* 翻页层（正在翻的那一页） */
  .page-flip {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: none;
    z-index: 10;
    pointer-events: none;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .page-flip img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }
  .page-flip.animate {
    transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* ===== 点击导航区 ===== */
  .nav-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 35%;
    z-index: 20;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-zone .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: rgba(255,255,255,0.3);
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
  }
  .nav-zone.left .arrow  { left: 16px; }
  .nav-zone.right .arrow { right: 16px; }
  .nav-zone:hover .arrow,
  .nav-zone:active .arrow { opacity: 1; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }

  /* ===== 底部页码 ===== */
  .page-info {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    z-index: 30;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .page-info.show {
    opacity: 1;
  }

  /* ===== 加载/错误 ===== */
  .loading, .error {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: #0f0f1a;
    z-index: 50;
  }
  .loading .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top: 3px solid #4a6cf7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .text, .error .text { color: rgba(255,255,255,0.5); font-size: 15px; }
  .error .emoji { font-size: 48px; }
  .error .btn { margin-top: 8px; padding: 10px 28px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }
  .error .btn:hover { border-color: #4a6cf7; color: #4a6cf7; }

  /* ===== 响应式 ===== */
  @media (max-width: 640px) {
    .nav-zone { width: 40%; }
    .nav-zone .arrow { width: 36px; height: 36px; font-size: 20px; }
    .nav-zone.left .arrow  { left: 8px; }
    .nav-zone.right .arrow { right: 8px; }
    .page-info { font-size: 12px; padding: 6px 16px; bottom: 20px; }
  }
</style>
</head>
<body>

<!-- 加载 -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="text" id="loadingText">正在加载文档...</div>
</div>

<!-- 错误 -->
<div class="error" id="error" style="display:none">
  <div class="emoji">📄</div>
  <div class="text" id="errorText">无法加载文档</div>
  <button class="btn" onclick="location.reload()">重新加载</button>
</div>

<!-- 全屏查看器 -->
<div class="viewer" id="viewer" style="display:none">

  <div class="book" id="book">
    <div class="page-wrap" id="pageWrap">
      <!-- 底层页（新页面） -->
      <img class="page-under" id="pageUnder" src="" alt="">
      <!-- 翻页层 -->
      <div class="page-flip" id="pageFlip">
        <img id="flipImg" src="" alt="">
      </div>
    </div>
  </div>

  <!-- 左导航（上一页） -->
  <div class="nav-zone left" id="navLeft">
    <div class="arrow">‹</div>
  </div>
  <!-- 右导航（下一页） -->
  <div class="nav-zone right" id="navRight">
    <div class="arrow">›</div>
  </div>

  <!-- 页码 -->
  <div class="page-info" id="pageInfo">0 / 0</div>
</div>

<script>
// ===== 获取文档 ID =====
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
if (!id) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
  document.getElementById('errorText').textContent = '缺少文档 ID，请检查链接';
  throw new Error('no id');
}

// ===== 状态 =====
let images = [];
let totalPages = 0;
let currentPage = 0;
let docTitle = '';
let isFlipping = false;

// 预加载缓存
const preloadCache = new Map();

// ===== DOM =====
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const error = document.getElementById('error');
const errorText = document.getElementById('errorText');
const viewer = document.getElementById('viewer');
const pageUnder = document.getElementById('pageUnder');
const pageFlip = document.getElementById('pageFlip');
const flipImg = document.getElementById('flipImg');
const pageWrap = document.getElementById('pageWrap');
const pageInfo = document.getElementById('pageInfo');
const navLeft = document.getElementById('navLeft');
const navRight = document.getElementById('navRight');

// ===== 预加载图片 =====
function preloadImage(url) {
  if (preloadCache.has(url)) return preloadCache.get(url);
  const p = new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => reject(url);
    img.src = url;
  });
  preloadCache.set(url, p);
  return p;
}

function preloadAdjacent(currentIdx) {
  const next = [currentIdx - 1, currentIdx, currentIdx + 1, currentIdx + 2];
  for (const i of next) {
    if (i >= 0 && i < totalPages && images[i]) {
      preloadImage(images[i]).catch(() => {});
    }
  }
}

// ===== 显示页码（短暂显示后淡出） =====
let pageInfoTimer = null;
function showPageInfo() {
  pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
  pageInfo.classList.add('show');
  clearTimeout(pageInfoTimer);
  pageInfoTimer = setTimeout(() => pageInfo.classList.remove('show'), 1800);
}

// ===== 翻页（方向：1=下一页，-1=上一页） =====
async function turnPage(direction) {
  const nextIdx = currentPage + direction;
  if (isFlipping || nextIdx < 0 || nextIdx >= totalPages) return;
  isFlipping = true;

  const currentUrl = images[currentPage];
  const nextUrl = images[nextIdx];

  // 1. 预加载目标页
  loadingText.textContent = '加载中...';
  await preloadImage(nextUrl).catch(() => {});
  loadingText.textContent = '正在加载文档...';

  // 2. 设置翻页图片（当前页的图片翻走）
  pageUnder.src = nextUrl;
  pageUnder.classList.remove('show');
  flipImg.src = currentUrl;

  // 3. 重置翻页层位置
  pageFlip.style.transition = 'none';
  pageFlip.style.transform = direction === 1 ? 'rotateY(0deg)' : 'rotateY(-180deg)';
  void pageWrap.offsetHeight; // force reflow

  // 4. 开翻
  pageFlip.style.transition = 'transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  pageFlip.style.transform = direction === 1 ? 'rotateY(-180deg)' : 'rotateY(0deg)';

  // 5. 等翻页完成
  await new Promise(r => { pageFlip.ontransitionend = r; setTimeout(r, 600); });

  // 6. 更新状态
  currentPage = nextIdx;
  pageUnder.classList.add('show');
  pageFlip.style.transition = 'none';
  pageFlip.style.transform = 'rotateY(0deg)';

  // 7. 预加载相邻页
  preloadAdjacent(currentPage);

  isFlipping = false;
  showPageInfo();
}

// ===== 加载文档 =====
async function loadDoc() {
  try {
    loadingText.textContent = '加载文档信息...';
    const resp = await fetch(`/api/view/${id}`);
    if (!resp.ok) throw new Error(resp.status === 404 ? '文档不存在或已过期' : '加载失败');
    const data = await resp.json();
    images = data.images;
    totalPages = data.totalPages;
    docTitle = data.title || '未命名文档';
    document.title = docTitle;

    // 从 hash 恢复页数
    const hash = window.location.hash.match(/page=(\d+)/);
    currentPage = hash ? Math.max(0, Math.min(parseInt(hash[1]) - 1, totalPages - 1)) : 0;

    // 加载第一页
    loadingText.textContent = '加载页面...';
    await preloadImage(images[currentPage]);

    // 显示界面
    loading.style.display = 'none';
    viewer.style.display = 'flex';
    pageUnder.src = images[currentPage];
    pageUnder.classList.add('show');
    preloadAdjacent(currentPage);
    showPageInfo();

    // 键盘
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') turnPage(-1);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
        e.preventDefault();
        turnPage(1);
      }
    });

    // 触摸滑动
    let tx = 0;
    document.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - tx;
      if (Math.abs(diff) > 50) turnPage(diff > 0 ? -1 : 1);
    }, { passive: true });

  } catch (err) {
    loading.style.display = 'none';
    error.style.display = 'flex';
    errorText.textContent = err.message;
  }
}

// ===== 导航事件 =====
navLeft.addEventListener('click', () => turnPage(-1));
navRight.addEventListener('click', () => turnPage(1));

// ===== 启动 =====
loadDoc();
</script>
</body>
</html>
