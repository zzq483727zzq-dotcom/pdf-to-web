<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title id="pageTitle">加载中...</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1a;
    color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-touch-callout: none;
  }

  .viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #0f0f1a;
    overflow: hidden;
  }

  .page-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 底层（下一页/上一页） */
  .page-under {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: #0f0f1a;
  }
  .page-under img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }
  .page-under .loading-tip {
    color: rgba(255,255,255,0.3);
    font-size: 14px;
    display: none;
  }
  .page-under.loading img { display: none; }
  .page-under.loading .loading-tip { display: block; }

  /* 顶层（当前页，可拖动） */
  .page-over {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 2;
    will-change: transform;
    background: #0f0f1a;
  }
  .page-over img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }
  .page-over.smooth {
    transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* 翻页按钮 */
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.3);
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.7); }
  .nav-btn:active { transform: translateY(-50%) scale(0.92); }
  .nav-btn.prev { left: 14px; }
  .nav-btn.next { right: 14px; }
  .nav-btn.hidden { opacity: 0; pointer-events: none; }

  .click-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40%;
    z-index: 20;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .click-zone.left  { left: 0; }
  .click-zone.right { right: 0; }

  .page-info {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    z-index: 30;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .page-info.show { opacity: 1; }

  .loading, .error {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: #0f0f1a;
    z-index: 50;
  }
  .loading .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top: 3px solid #4a6cf7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .text, .error .text { color: rgba(255,255,255,0.5); font-size: 15px; }
  .error .emoji { font-size: 48px; }
  .error .btn { margin-top: 8px; padding: 10px 28px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }

  @media (max-width: 640px) {
    .nav-btn { width: 40px; height: 40px; font-size: 20px; }
    .nav-btn.prev { left: 6px; }
    .nav-btn.next { right: 6px; }
    .click-zone { width: 45%; }
    .page-info { font-size: 12px; padding: 6px 16px; bottom: 20px; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="text" id="loadingText">正在加载文档...</div>
</div>

<div class="error" id="error" style="display:none">
  <div class="emoji">📄</div>
  <div class="text" id="errorText">无法加载文档</div>
  <button class="btn" onclick="location.reload()">重新加载</button>
</div>

<div class="viewer" id="viewer" style="display:none">
  <div class="page-wrap" id="pageWrap">
    <div class="page-under" id="pageUnder">
      <img id="underImg" src="" alt="">
      <span class="loading-tip">加载中...</span>
    </div>
    <div class="page-over" id="pageOver">
      <img id="pageImg" src="" alt="" fetchpriority="high">
    </div>
  </div>

  <div class="click-zone left" id="zoneLeft"></div>
  <div class="click-zone right" id="zoneRight"></div>

  <button class="nav-btn prev" id="prevBtn">‹</button>
  <button class="nav-btn next" id="nextBtn">›</button>

  <div class="page-info" id="pageInfo">0 / 0</div>
</div>

<script>
const id = new URLSearchParams(window.location.search).get('id');
if (!id) { finishError('缺少文档 ID'); throw new Error('no id'); }

let images = [], totalPages = 0, currentPage = 0, docTitle = '';
const cache = new Map();
const $ = s => document.getElementById(s);
const loading = $('loading'), loadingText = $('loadingText');
const error = $('error'), errorText = $('errorText');
const viewer = $('viewer'), pageWrap = $('pageWrap');
const pageImg = $('pageImg'), underImg = $('underImg');
const pageOver = $('pageOver'), pageUnder = $('pageUnder');
const pageInfo = $('pageInfo'), prevBtn = $('prevBtn'), nextBtn = $('nextBtn');
const zoneLeft = $('zoneLeft'), zoneRight = $('zoneRight');

function finishError(msg) {
  loading.style.display = 'none';
  error.style.display = 'flex';
  errorText.textContent = msg;
}

// ===== 预加载（确保图片加载完成） =====
function preload(url) {
  if (cache.has(url)) {
    const entry = cache.get(url);
    // 如果已经加载完成，直接返回成功
    if (entry.loaded) return Promise.resolve(url);
    return entry.promise;
  }
  const entry = { loaded: false, promise: null };
  entry.promise = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { entry.loaded = true; res(url); };
    img.onerror = () => rej(url);
    img.src = url;
  });
  cache.set(url, entry);
  return entry.promise;
}

function isCached(url) {
  return cache.has(url) && cache.get(url).loaded;
}

// 预加载周围页
function preloadNearby(idx) {
  for (const i of [idx + 1, idx + 2, idx - 1, idx - 2]) {
    if (i >= 0 && i < totalPages && images[i]) {
      preload(images[i]).catch(() => {});
    }
  }
}

// ===== UI =====
let pageInfoTimer = null;
function showPageInfo() {
  pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
  pageInfo.classList.add('show');
  clearTimeout(pageInfoTimer);
  pageInfoTimer = setTimeout(() => pageInfo.classList.remove('show'), 2000);
}
function updateButtons() {
  prevBtn.classList.toggle('hidden', currentPage <= 0);
  nextBtn.classList.toggle('hidden', currentPage >= totalPages - 1);
}

// ===== 翻页（确保图片已加载） =====
async function goToPage(idx, animate) {
  if (idx < 0 || idx >= totalPages || idx === currentPage) return;

  // 先确保目标页已加载
  const url = images[idx];
  if (!isCached(url)) {
    // 显示加载中（仅在点击按钮时）
    pageUnder.classList.add('loading');
    try { await preload(url); } catch(e) { pageUnder.classList.remove('loading'); return; }
    pageUnder.classList.remove('loading');
  }

  if (animate === 'left') {
    pageOver.classList.remove('smooth');
    underImg.src = url;
    pageOver.style.transform = 'translateX(0)';
    void pageOver.offsetHeight;
    pageOver.classList.add('smooth');
    pageOver.style.transform = 'translateX(-100%)';
    setTimeout(() => {
      currentPage = idx;
      pageOver.classList.remove('smooth');
      pageOver.style.transform = 'translateX(0)';
      pageImg.src = url;
      underImg.src = '';
      updateButtons(); showPageInfo(); preloadNearby(currentPage);
    }, 300);
    return;
  }
  if (animate === 'right') {
    pageOver.classList.remove('smooth');
    underImg.src = url;
    pageOver.style.transform = 'translateX(0)';
    void pageOver.offsetHeight;
    pageOver.classList.add('smooth');
    pageOver.style.transform = 'translateX(100%)';
    setTimeout(() => {
      currentPage = idx;
      pageOver.classList.remove('smooth');
      pageOver.style.transform = 'translateX(0)';
      pageImg.src = url;
      underImg.src = '';
      updateButtons(); showPageInfo(); preloadNearby(currentPage);
    }, 300);
    return;
  }

  // 无动画
  currentPage = idx;
  pageImg.src = url;
  underImg.src = '';
  pageOver.style.transform = 'translateX(0)';
  updateButtons(); showPageInfo(); preloadNearby(currentPage);
}

function goPrev() { goToPage(currentPage - 1, 'right'); }
function goNext() { goToPage(currentPage + 1, 'left'); }

// ===== 拖拽翻页 =====
let drag = null;
let raf = null;

function startDrag(x) {
  if (drag) return;
  drag = { startX: x, curX: x, active: false, dir: 0, targetIdx: -1, url: '' };
}

function moveDrag(x) {
  if (!drag) return;
  drag.curX = x;
  const dx = drag.curX - drag.startX;

  if (!drag.active) {
    if (Math.abs(dx) < 12) return;
    drag.active = true;
    drag.dir = dx < 0 ? 1 : -1;
    drag.targetIdx = currentPage + drag.dir;
    if (drag.targetIdx < 0 || drag.targetIdx >= totalPages) { drag = null; return; }
    drag.url = images[drag.targetIdx];

    // 设置底层（先显示加载中，直到图片加载完成）
    pageUnder.classList.add('loading');
    underImg.src = drag.url;
    // 预加载
    preload(drag.url).then(() => {
      pageUnder.classList.remove('loading');
    }).catch(() => {});

    pageOver.classList.remove('smooth');
    pageOver.style.transform = 'translateX(0)';
    void pageOver.offsetHeight;
  }

  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    raf = null;
    pageOver.style.transform = `translateX(${dx}px)`;
  });
}

function endDrag() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  if (!drag) return;
  const dx = drag.curX - drag.startX;
  const w = window.innerWidth;

  if (drag.active && Math.abs(dx) > w * 0.18) {
    const dir = dx < 0 ? 1 : -1;
    const targetIdx = currentPage + dir;
    if (targetIdx >= 0 && targetIdx < totalPages) {
      const url = images[targetIdx];
      pageOver.classList.add('smooth');
      pageOver.style.transform = `translateX(${dir === 1 ? '-100%' : '100%'})`;
      setTimeout(() => {
        currentPage = targetIdx;
        pageOver.classList.remove('smooth');
        pageOver.style.transform = 'translateX(0)';
        pageImg.src = url;
        pageUnder.classList.remove('loading');
        underImg.src = '';
        updateButtons(); showPageInfo(); preloadNearby(currentPage);
      }, 300);
      drag = null;
      return;
    }
  }
  // 弹回
  pageOver.classList.add('smooth');
  pageOver.style.transform = 'translateX(0)';
  setTimeout(() => pageOver.classList.remove('smooth'), 300);
  drag = null;
}

// 事件
viewer.addEventListener('mousedown', e => startDrag(e.clientX));
window.addEventListener('mousemove', e => { if (drag) moveDrag(e.clientX); });
window.addEventListener('mouseup', () => endDrag());

viewer.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  startDrag(e.touches[0].clientX);
}, { passive: true });
viewer.addEventListener('touchmove', e => {
  if (e.touches.length !== 1) return;
  moveDrag(e.touches[0].clientX);
}, { passive: true });
viewer.addEventListener('touchend', () => endDrag(), { passive: true });

prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);
zoneLeft.addEventListener('click', goPrev);
zoneRight.addEventListener('click', goNext);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goPrev();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault(); goNext();
  }
});

// ===== 加载 =====
async function loadDoc() {
  try {
    loadingText.textContent = '加载文档信息...';
    const resp = await fetch(`/api/view/${id}`);
    if (!resp.ok) throw new Error(resp.status === 404 ? '文档不存在或已过期' : '加载失败');
    const data = await resp.json();
    images = data.images; totalPages = data.totalPages; docTitle = data.title || '未命名文档';
    document.title = docTitle;
    const hash = window.location.hash.match(/page=(\d+)/);
    currentPage = hash ? Math.max(0, Math.min(parseInt(hash[1]) - 1, totalPages - 1)) : 0;

    loadingText.textContent = '加载页面...';
    // 预加载当前页，确保首屏加载完成
    const firstUrl = images[currentPage];
    // 直接预加载，同时用 img 标签加载
    pageImg.src = firstUrl;
    await preload(firstUrl);

    loading.style.display = 'none';
    viewer.style.display = 'flex';
    updateButtons(); showPageInfo();
    preloadNearby(currentPage);

  } catch (err) {
    finishError(err.message);
  }
}

loadDoc();
</script>
</body>
</html>
