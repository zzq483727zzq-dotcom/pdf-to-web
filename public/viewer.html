<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title id="pageTitle">加载中...</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f1a;
    color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-touch-callout: none;
  }

  .viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #0f0f1a;
    overflow: hidden;
  }

  .book {
    perspective: 2500px;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .page-wrap {
    position: relative;
    max-width: 98vw;
    max-height: 98vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 防止拖拽时选中 */
    pointer-events: none;
  }

  /* 底层页（新页面，被翻出来） */
  .page-under {
    display: block;
    max-width: 98vw;
    max-height: 98vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
    position: relative;
    z-index: 1;
  }

  /* 翻页层（正在翻的那一页） */
  .page-flip {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: left center;
    transform: rotateY(0deg);
    z-index: 10;
    pointer-events: none;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    /* 默认无动画，通过 JS 控制 */
    transition: none;
  }
  .page-flip img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }

  /* 翻页阴影 */
  .page-flip::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to left, rgba(0,0,0,0.15), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    border-radius: 2px;
  }
  .page-flip.shadow::after {
    opacity: 1;
  }

  /* 鼠标拖拽提示 */
  .drag-hint {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .drag-hint.left  { left: 12px; }
  .drag-hint.right { right: 12px; }
  .drag-hint.show { opacity: 1; }
  .drag-hint span {
    display: block;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: rgba(255,255,255,0.3);
  }

  /* 页码 */
  .page-info {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    z-index: 30;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    white-space: nowrap;
  }
  .page-info.show { opacity: 1; }

  /* 加载 */
  .loading, .error {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: #0f0f1a;
    z-index: 50;
  }
  .loading .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top: 3px solid #4a6cf7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .text, .error .text { color: rgba(255,255,255,0.5); font-size: 15px; }
  .error .emoji { font-size: 48px; }
  .error .btn { margin-top: 8px; padding: 10px 28px; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; background: transparent; color: #fff; font-size: 14px; cursor: pointer; }
  .error .btn:hover { border-color: #4a6cf7; color: #4a6cf7; }

  @media (max-width: 640px) {
    .page-info { font-size: 12px; padding: 6px 16px; bottom: 20px; }
  }

  /* 禁止点击时闪烁 */
  .viewer.dragging { cursor: grabbing; }
  .viewer:not(.dragging) { cursor: default; }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="text" id="loadingText">正在加载文档...</div>
</div>

<div class="error" id="error" style="display:none">
  <div class="emoji">📄</div>
  <div class="text" id="errorText">无法加载文档</div>
  <button class="btn" onclick="location.reload()">重新加载</button>
</div>

<div class="viewer" id="viewer" style="display:none">
  <div class="book" id="book">
    <div class="page-wrap" id="pageWrap">
      <img class="page-under" id="pageUnder" src="" alt="">
      <div class="page-flip" id="pageFlip">
        <img id="flipImg" src="" alt="">
      </div>
    </div>
  </div>
  <div class="page-info" id="pageInfo">0 / 0</div>
</div>

<script>
// ===== ID =====
const id = new URLSearchParams(window.location.search).get('id');
if (!id) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'flex';
  document.getElementById('errorText').textContent = '缺少文档 ID，请检查链接';
  throw new Error('no id');
}

// ===== 状态 =====
let images = [], totalPages = 0, currentPage = 0, docTitle = '';
let isFlipping = false;
const preloadCache = new Map();

// ===== DOM =====
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const error = document.getElementById('error');
const errorText = document.getElementById('errorText');
const viewer = document.getElementById('viewer');
const pageUnder = document.getElementById('pageUnder');
const pageFlip = document.getElementById('pageFlip');
const flipImg = document.getElementById('flipImg');
const pageWrap = document.getElementById('pageWrap');
const pageInfo = document.getElementById('pageInfo');

// ===== 预加载 =====
function preloadImage(url) {
  if (preloadCache.has(url)) return preloadCache.get(url);
  const p = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { res(url); };
    img.onerror = () => rej(url);
    img.src = url;
  });
  preloadCache.set(url, p);
  return p;
}

function preloadAdjacent(idx) {
  for (const i of [idx - 1, idx, idx + 1, idx + 2]) {
    if (i >= 0 && i < totalPages && images[i]) {
      preloadImage(images[i]).catch(() => {});
    }
  }
}

// ===== 页码 =====
let pageInfoTimer = null;
function showPageInfo() {
  pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
  pageInfo.classList.add('show');
  clearTimeout(pageInfoTimer);
  pageInfoTimer = setTimeout(() => pageInfo.classList.remove('show'), 2000);
}

// ===== 翻页（动画完成才更新状态） =====
function animateFlip(angle, dur) {
  return new Promise(resolve => {
    pageFlip.style.transition = `transform ${dur}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
    pageFlip.style.transform = `rotateY(${angle}deg)`;
    const done = () => { pageFlip.ontransitionend = null; pageFlip.ontransitioncancel = null; resolve(); };
    pageFlip.ontransitionend = done;
    pageFlip.ontransitioncancel = done;
    setTimeout(done, dur + 50);
  });
}

async function turnPage(direction) {
  const nextIdx = currentPage + direction;
  if (isFlipping || nextIdx < 0 || nextIdx >= totalPages) return;
  isFlipping = true;

  // 设置底层 → 目标页
  await preloadImage(images[nextIdx]).catch(() => {});
  pageUnder.src = images[nextIdx];

  // 翻页层 = 当前页
  flipImg.src = images[currentPage];

  // 复位翻页层
  pageFlip.style.transition = 'none';
  pageFlip.style.transform = 'rotateY(0deg)';
  void pageWrap.offsetHeight;

  // 翻过去
  const targetAngle = direction === 1 ? -180 : 180;
  await animateFlip(targetAngle, 500);

  // 完成
  currentPage = nextIdx;
  pageFlip.style.transition = 'none';
  pageFlip.style.transform = 'rotateY(0deg)';
  pageUnder.src = images[currentPage];
  preloadAdjacent(currentPage);
  isFlipping = false;
  showPageInfo();
}

// ===== 拖拽翻页（鼠标 + 触屏统一） =====
let dragState = null;

function getPointerX(e) {
  return e.clientX ?? e.changedTouches?.[0]?.clientX ?? 0;
}

function onPointerDown(e) {
  if (isFlipping) return;
  const x = getPointerX(e);
  const rect = viewer.getBoundingClientRect();
  dragState = {
    startX: x,
    currentX: x,
    direction: x < rect.width / 2 ? -1 : 1, // 左半屏=上一页，右半屏=下一页
    isDragging: false,
    moved: false,
    targetIdx: -1,
    startAngle: 0
  };
}

function onPointerMove(e) {
  if (!dragState || isFlipping) return;
  const x = getPointerX(e);
  const dx = x - dragState.startX;

  // 死区 8px 才触发
  if (!dragState.isDragging) {
    if (Math.abs(dx) < 8) return;
    dragState.isDragging = true;
    viewer.classList.add('dragging');

    // 确定目标页
    const dir = dx < 0 ? 1 : -1;
    dragState.targetIdx = currentPage + dir;
    if (dragState.targetIdx < 0 || dragState.targetIdx >= totalPages) {
      dragState.isDragging = false;
      viewer.classList.remove('dragging');
      return;
    }

    // 预加载目标页
    preloadImage(images[dragState.targetIdx]).catch(() => {});
    // 设置底层（目标页）
    pageUnder.src = images[dragState.targetIdx];
    // 翻页层 = 当前页
    flipImg.src = images[currentPage];
    // 复位
    pageFlip.style.transition = 'none';
    pageFlip.style.transform = 'rotateY(0deg)';
    void pageWrap.offsetHeight;
  }

  dragState.moved = true;
  dragState.currentX = x;

  // 计算翻页角度：dx / 容器宽度 → 映射到 0~-180 度
  const wrapW = pageWrap.offsetWidth || window.innerWidth;
  let progress = dx / (wrapW * 0.6); // 拖到 60% 宽度就翻完
  progress = Math.max(-1, Math.min(1, progress));

  // 拖向右 = 正角度（往回翻），拖向左 = 负角度（往前翻）
  let angle = progress * -180;
  angle = Math.max(-180, Math.min(180, angle));

  // 去掉过渡动画，实时跟随
  pageFlip.style.transition = 'none';
  pageFlip.style.transform = `rotateY(${angle}deg)`;
}

function onPointerUp(e) {
  if (!dragState) return;
  viewer.classList.remove('dragging');

  const dx = dragState.currentX - dragState.startX;

  if (dragState.isDragging && dragState.moved && Math.abs(dx) > 30) {
    // 拖拽超过阈值 → 完成翻页
    const dir = dx < 0 ? 1 : -1;
    const targetIdx = currentPage + dir;
    if (targetIdx >= 0 && targetIdx < totalPages) {
      isFlipping = true;
      const finalAngle = dir === 1 ? -180 : 180;
      // 用动画完成剩余行程
      pageFlip.style.transition = 'transform 250ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      pageFlip.style.transform = `rotateY(${finalAngle}deg)`;

      setTimeout(() => {
        currentPage = targetIdx;
        pageFlip.style.transition = 'none';
        pageFlip.style.transform = 'rotateY(0deg)';
        pageUnder.src = images[currentPage];
        preloadAdjacent(currentPage);
        isFlipping = false;
        showPageInfo();
      }, 260);
    } else {
      // 超出边界，弹回
      pageFlip.style.transition = 'transform 200ms ease';
      pageFlip.style.transform = 'rotateY(0deg)';
    }
  } else if (dragState.isDragging) {
    // 拖拽不足阈值 → 弹回
    pageFlip.style.transition = 'transform 200ms ease';
    pageFlip.style.transform = 'rotateY(0deg)';
  }

  dragState = null;
}

// ===== 统一事件绑定 =====
// 鼠标
viewer.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

// 触屏
viewer.addEventListener('touchstart', (e) => {
  // 只取第一指
  if (e.touches.length !== 1) return;
  onPointerDown({ clientX: e.touches[0].clientX });
}, { passive: true });

viewer.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  onPointerMove({ clientX: e.touches[0].clientX });
}, { passive: true });

viewer.addEventListener('touchend', (e) => {
  onPointerUp({ clientX: e.changedTouches[0].clientX });
}, { passive: true });

// 键盘
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') turnPage(-1);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    turnPage(1);
  }
});

// 窗口大小变化时重置
window.addEventListener('resize', () => {});

// ===== 加载 =====
async function loadDoc() {
  try {
    loadingText.textContent = '加载文档信息...';
    const resp = await fetch(`/api/view/${id}`);
    if (!resp.ok) throw new Error(resp.status === 404 ? '文档不存在或已过期' : '加载失败');
    const data = await resp.json();
    images = data.images;
    totalPages = data.totalPages;
    docTitle = data.title || '未命名文档';
    document.title = docTitle;

    const hash = window.location.hash.match(/page=(\d+)/);
    currentPage = hash ? Math.max(0, Math.min(parseInt(hash[1]) - 1, totalPages - 1)) : 0;

    loadingText.textContent = '加载页面...';
    await preloadImage(images[currentPage]);

    loading.style.display = 'none';
    viewer.style.display = 'flex';
    pageUnder.src = images[currentPage];
    preloadAdjacent(currentPage);
    showPageInfo();

  } catch (err) {
    loading.style.display = 'none';
    error.style.display = 'flex';
    errorText.textContent = err.message;
  }
}

loadDoc();
</script>
</body>
</html>
